# Production stack using images from GitHub Container Registry.
# After CD pushes to main:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# Set packages to Public under GitHub Packages for frictionless pulls,
# or: echo $GITHUB_TOKEN | docker login ghcr.io -u USERNAME --password-stdin
#
# Override image owner if needed:
#   GHCR_OWNER=rohitdeshmukh002 docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: employee-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-employee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-employee}
      POSTGRES_DB: ${POSTGRES_DB:-employee_management}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-employee} -d ${POSTGRES_DB:-employee_management}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ghcr.io/${GHCR_OWNER:-rohitdeshmukh002}/employee-management-backend:${IMAGE_TAG:-latest}
    container_name: employee-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-employee}:${POSTGRES_PASSWORD:-employee}@postgres:5432/${POSTGRES_DB:-employee_management}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      OFFICE_LAT: ${OFFICE_LAT:-18.5204}
      OFFICE_LNG: ${OFFICE_LNG:-73.8567}
      OFFICE_RADIUS_M: ${OFFICE_RADIUS_M:-300}
      UPLOAD_DIR: /app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - payslip_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GHCR_OWNER:-rohitdeshmukh002}/employee-management-frontend:${IMAGE_TAG:-latest}
    container_name: employee-frontend
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  payslip_uploads:
